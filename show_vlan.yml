---
- name: Dell VLAN Übersicht
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: VLAN Informationen auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: result

    - name: VLANs extrahieren
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ item }}"
      loop: >-
        {{
          result.stdout[0].splitlines()
          | select('match', '^[0-9]+\\s+')
          | list
        }}
