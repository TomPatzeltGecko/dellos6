---
- name: Dell VLAN Debug
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: VLAN Informationen auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: result

    - name: Rohdaten anzeigen
      debug:
        var: result.stdout_lines[0]
