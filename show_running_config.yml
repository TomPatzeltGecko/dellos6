---
- name: Dell Running Config anzeigen
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable
    ansible_command_timeout: 120

  tasks:
    - name: Running Config auslesen
      dellemc.os6.os6_command:
        commands:
          - show running-config
      register: result

    - name: Sensible Konfigurationszeilen ausblenden
      ansible.builtin.set_fact:
        sanitized_config: >-
          {{
            result.stdout[0].splitlines()
            | reject('match', '^\s*username\s+')
            | reject('match', '^\s*enable password\s+')
            | reject('match', '^\s*snmp-server community\s+')
            | list
          }}

    - name: Bereinigte Running Config ausgeben
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "IP-Adresse: {{ ansible_host | default(inventory_hostname) }}"
          - "Hinweis: Benutzer-, Enable- und SNMP-Secrets wurden ausgeblendet."
          - "{{ sanitized_config }}"
