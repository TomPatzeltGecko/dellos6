---
- name: Dell Image Versionen
  hosts: dell_switches
  gather_facts: false

  tasks:
    - name: Show Version
      dellemc.os6.os6_command:
        commands:
          - show version
      register: result

    - name: Ausgabe
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ item }}"
      loop: >-
        {{
          result.stdout[0].split('\n')
          | select('match', '^[0-9]+\\s+')
          | list
        }}
