---
- name: Dell Image Versionen
  hosts: dell_switches
  gather_facts: false

  tasks:
    - name: Show Version
      dellemc.os6.os6_command:
        commands:
          - show version
      register: result

    - name: Stack Images anzeigen
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ item }}"
      loop: "{{ result.stdout[0].split('\n') }}"
      when: item is match('^[0-9]+\\s+')
