---
- name: Dell Image Versionen
  hosts: dell_switches
  gather_facts: false

  tasks:
    - name: Show Version
      dellemc.os6.os6_command:
        commands:
          - show version
      register: result

    - name: Active und Backup Image
      debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Active: {{ result.stdout[0] | regex_search('(?m)^1\\s+(\\S+)', '\\1') }}"
          - "Backup: {{ result.stdout[0] | regex_search('(?m)^1\\s+\\S+\\s+(\\S+)', '\\1') }}"
``
