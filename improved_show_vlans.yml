---
- name: Dell VLAN-Gesamtuebersicht
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable
    ansible_command_timeout: 120

  tasks:
    - name: VLAN-Informationen von den Switches auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: vlan_result

    - name: VLAN-Datenstruktur initialisieren
      ansible.builtin.set_fact:
        switch_vlans: {}

    - name: VLAN-ID und VLAN-Name erfassen
      ansible.builtin.set_fact:
        switch_vlans: >-
          {{
            switch_vlans
            | combine({
                (item[0:5] | trim): (item[7:40] | trim)
              })
          }}
      loop: >-
        {{
          vlan_result.stdout_lines[0]
          | select('match', '^[0-9]')
          | list
        }}
      no_log: true

    - name: Alle VLAN-IDs zusammenfuehren
      ansible.builtin.set_fact:
        all_vlan_ids: >-
          {{
            groups['dell_switches']
            | map('extract', hostvars, 'switch_vlans')
            | map('list')
            | flatten
            | unique
            | map('int')
            | sort
            | list
          }}
      run_once: true

    - name: VLAN-Gesamtuebersicht anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          DELL VLAN-GESAMTUEBERSICHT
          ============================================================
          Ausgewertete Switches: {{ groups['dell_switches'] | length }}
          Gefundene VLAN-IDs:    {{ all_vlan_ids | length }}

          {% for vlan_number in all_vlan_ids %}
          {% set vlan_id = vlan_number | string %}
          {% set ns = namespace(present=[], missing=[], names=[]) %}

          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
          {% set _ = ns.present.append(switch) %}
          {% set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {% if vlan_name not in ns.names %}
          {% set _ = ns.names.append(vlan_name) %}
          {% endif %}
          {% else %}
          {% set _ = ns.missing.append(switch) %}
          {% endif %}
          {% endfor %}

          ------------------------------------------------------------
          VLAN {{ vlan_id }} | {{ ns.names | join(' / ') }}
          ------------------------------------------------------------
          Vorhanden auf {{ ns.present | length }} von {{ groups['dell_switches'] | length }} Switches:
          {% for switch in ns.present %}
            + {{ switch }}{% if hostvars[switch].ansible_host is defined %} ({{ hostvars[switch].ansible_host }}){% endif %}
          {% endfor %}
          {% if ns.missing | length > 0 %}
          Fehlt auf:
          {% for switch in ns.missing %}
            - {{ switch }}{% if hostvars[switch].ansible_host is defined %} ({{ hostvars[switch].ansible_host }}){% endif %}
          {% endfor %}
          {% else %}
          Status: Auf allen Switches vorhanden
          {% endif %}

          {% endfor %}
      run_once: true

    - name: Zusammenfassung der Abweichungen anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          VLAN-ABWEICHUNGEN
          ============================================================
          {% set report = namespace(missing_count=0, name_count=0) %}

          {% for vlan_number in all_vlan_ids %}
          {% set vlan_id = vlan_number | string %}
          {% set ns = namespace(present=[], missing=[], names=[]) %}

          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
          {% set _ = ns.present.append(switch) %}
          {% set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {% if vlan_name not in ns.names %}
          {% set _ = ns.names.append(vlan_name) %}
          {% endif %}
          {% else %}
          {% set _ = ns.missing.append(switch) %}
          {% endif %}
          {% endfor %}

          {% if ns.missing | length > 0 %}
          {% set report.missing_count = report.missing_count + 1 %}
          VLAN {{ vlan_id }} | {{ ns.names | join(' / ') }}
            Fehlt auf: {{ ns.missing | join(', ') }}
          {% endif %}

          {% if ns.names | length > 1 %}
          {% set report.name_count = report.name_count + 1 %}
          VLAN {{ vlan_id }} hat unterschiedliche Namen:
          {% for switch in ns.present %}
            {{ switch }}: {{ hostvars[switch].switch_vlans[vlan_id] }}
          {% endfor %}
          {% endif %}

          {% endfor %}

          VLANs, die nicht überall vorhanden sind: {{ report.missing_count }}
          VLANs mit unterschiedlichen Namen:       {{ report.name_count }}

          {% if report.missing_count == 0 and report.name_count == 0 %}
          Status: Keine VLAN-Abweichungen erkannt.
          {% endif %}
      run_once: true
