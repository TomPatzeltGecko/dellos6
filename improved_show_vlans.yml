---
- name: Dell VLAN-Gesamtuebersicht
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable
    ansible_command_timeout: 120

  tasks:
    - name: VLAN-Informationen auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: vlan_result

    - name: VLAN-Datenstruktur initialisieren
      ansible.builtin.set_fact:
        switch_vlans: {}

    - name: VLAN-ID und VLAN-Name erfassen
      ansible.builtin.set_fact:
        switch_vlans: >-
          {{
            switch_vlans
            | combine({
                (item[0:5] | trim): (item[7:40] | trim)
              })
          }}
      loop: >-
        {{
          vlan_result.stdout_lines[0]
          | select('match', '^[0-9]')
          | list
        }}
      no_log: true

    - name: Alle VLAN-IDs zusammenfuehren
      ansible.builtin.set_fact:
        all_vlan_ids: >-
          {{
            groups['dell_switches']
            | map('extract', hostvars, 'switch_vlans')
            | map('list')
            | flatten
            | unique
            | map('int')
            | sort
            | list
          }}
      run_once: true

    - name: Kompakte VLAN-Uebersicht anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          DELL VLAN-ÜBERSICHT
          ============================================================
          Switches: {{ groups['dell_switches'] | length }}
          VLANs:    {{ all_vlan_ids | length }}

          VLAN-ID | VLAN-Name | Switches
          ------------------------------------------------------------
          {%- for vlan_number in all_vlan_ids %}
          {%- set vlan_id = vlan_number | string %}
          {%- set ns = namespace(present=[], names=[]) %}
          {%- for switch in groups['dell_switches'] %}
          {%- if vlan_id in hostvars[switch].switch_vlans %}
          {%- set _ = ns.present.append(switch) %}
          {%- set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {%- if vlan_name not in ns.names %}
          {%- set _ = ns.names.append(vlan_name) %}
          {%- endif %}
          {%- endif %}
          {%- endfor %}
          {{ "\n" }}VLAN {{ "%-4s" | format(vlan_id) }} | {{ ns.names | join(" / ") }} | {{ ns.present | length }}/{{ groups['dell_switches'] | length }}
          {%- endfor %}
      run_once: true

    - name: Fehlende VLANs kompakt anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          VLANs, DIE NICHT AUF ALLEN SWITCHES VORHANDEN SIND
          ============================================================
          {%- set report = namespace(count=0) %}
          {%- for vlan_number in all_vlan_ids %}
          {%- set vlan_id = vlan_number | string %}
          {%- set ns = namespace(present=[], missing=[], names=[]) %}
          {%- for switch in groups['dell_switches'] %}
          {%- if vlan_id in hostvars[switch].switch_vlans %}
          {%- set _ = ns.present.append(switch) %}
          {%- set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {%- if vlan_name not in ns.names %}
          {%- set _ = ns.names.append(vlan_name) %}
          {%- endif %}
          {%- else %}
          {%- set _ = ns.missing.append(switch) %}
          {%- endif %}
          {%- endfor %}
          {%- if ns.missing | length > 0 %}
          {%- set report.count = report.count + 1 %}
          {{ "\n" }}VLAN {{ "%-4s" | format(vlan_id) }} | {{ ns.names | join(" / ") }}
            Fehlt auf: {{ ns.missing | join(", ") }}
          {%- endif %}
          {%- endfor %}

          {{ "\n" }}Anzahl betroffener VLANs: {{ report.count }}
      run_once: true

    - name: VLAN-Namensabweichungen kompakt anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          UNTERSCHIEDLICHE VLAN-NAMEN
          ============================================================
          {%- set report = namespace(count=0) %}
          {%- for vlan_number in all_vlan_ids %}
          {%- set vlan_id = vlan_number | string %}
          {%- set ns = namespace(names=[]) %}
          {%- for switch in groups['dell_switches'] %}
          {%- if vlan_id in hostvars[switch].switch_vlans %}
          {%- set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {%- if vlan_name not in ns.names %}
          {%- set _ = ns.names.append(vlan_name) %}
          {%- endif %}
          {%- endif %}
          {%- endfor %}
          {%- if ns.names | length > 1 %}
          {%- set report.count = report.count + 1 %}
          {{ "\n" }}VLAN {{ "%-4s" | format(vlan_id) }} | {{ ns.names | join(" / ") }}
          {%- endif %}
          {%- endfor %}

          {{ "\n" }}Anzahl Namensabweichungen: {{ report.count }}
      run_once: true
