---
- name: Dell VLAN-Gesamtuebersicht
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable
    ansible_command_timeout: 120

  tasks:
    - name: VLAN-Informationen von den Switches auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: vlan_result

    - name: VLAN-Datenstruktur initialisieren
      ansible.builtin.set_fact:
        switch_vlans: {}

    - name: VLAN-ID und VLAN-Name erfassen
      ansible.builtin.set_fact:
        switch_vlans: >-
          {{
            switch_vlans
            | combine({
                (item[0:5] | trim): (item[7:40] | trim)
              })
          }}
      loop: >-
        {{
          vlan_result.stdout_lines[0]
          | select('match', '^[0-9]')
          | list
        }}
      no_log: true

    - name: Alle VLAN-IDs zusammenfuehren
      ansible.builtin.set_fact:
        all_vlan_ids: >-
          {{
            groups['dell_switches']
            | map('extract', hostvars, 'switch_vlans')
            | map('list')
            | flatten
            | unique
            | map('int')
            | sort
            | list
          }}
      run_once: true

    - name: VLAN-Gesamtuebersicht erstellen
      ansible.builtin.set_fact:
        vlan_overview_lines: >-
          {%- set ns = namespace(lines=[]) -%}
          {%- set _ = ns.lines.append('DELL VLAN-GESAMTUEBERSICHT') -%}
          {%- set _ = ns.lines.append(
            'Ausgewertete Switches: ' ~
            (groups['dell_switches'] | length | string)
          ) -%}
          {%- set _ = ns.lines.append(
            'Gefundene VLANs: ' ~
            (all_vlan_ids | length | string)
          ) -%}
          {%- set _ = ns.lines.append('') -%}
          {%- set _ = ns.lines.append(
            'VLAN-ID | VLAN-Name | Vorhanden'
          ) -%}
          {%- set _ = ns.lines.append(
            '------------------------------------------------------------'
          ) -%}

          {%- for vlan_number in all_vlan_ids -%}
            {%- set vlan_id = vlan_number | string -%}
            {%- set data = namespace(present=[], names=[]) -%}

            {%- for switch in groups['dell_switches'] -%}
              {%- if vlan_id in hostvars[switch].switch_vlans -%}
                {%- set _ = data.present.append(switch) -%}
                {%- set vlan_name =
                  hostvars[switch].switch_vlans[vlan_id]
                -%}

                {%- if vlan_name not in data.names -%}
                  {%- set _ = data.names.append(vlan_name) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {%- set _ = ns.lines.append(
              'VLAN ' ~ ('%-4s' | format(vlan_id)) ~
              ' | ' ~ (data.names | join(' / ')) ~
              ' | ' ~ (data.present | length | string) ~
              '/' ~ (groups['dell_switches'] | length | string)
            ) -%}
          {%- endfor -%}

          {{ ns.lines }}
      run_once: true
      no_log: true

    - name: VLAN-Gesamtuebersicht anzeigen
      ansible.builtin.debug:
        msg: "{{ vlan_overview_lines }}"
      run_once: true

    - name: VLAN-Abweichungen erstellen
      ansible.builtin.set_fact:
        vlan_missing_lines: >-
          {%- set report = namespace(lines=[], count=0) -%}
          {%- set _ = report.lines.append(
            'VLANS, DIE NICHT UEBERALL VORHANDEN SIND'
          ) -%}
          {%- set _ = report.lines.append('') -%}

          {%- for vlan_number in all_vlan_ids -%}
            {%- set vlan_id = vlan_number | string -%}
            {%- set data =
              namespace(present=[], missing=[], names=[])
            -%}

            {%- for switch in groups['dell_switches'] -%}
              {%- if vlan_id in hostvars[switch].switch_vlans -%}
                {%- set _ = data.present.append(switch) -%}
                {%- set vlan_name =
                  hostvars[switch].switch_vlans[vlan_id]
                -%}

                {%- if vlan_name not in data.names -%}
                  {%- set _ = data.names.append(vlan_name) -%}
                {%- endif -%}
              {%- else -%}
                {%- set _ = data.missing.append(switch) -%}
              {%- endif -%}
            {%- endfor -%}

            {%- if data.missing | length > 0 -%}
              {%- set report.count = report.count + 1 -%}

              {%- set _ = report.lines.append(
                'VLAN ' ~ ('%-4s' | format(vlan_id)) ~
                ' | ' ~ (data.names | join(' / '))
              ) -%}

              {%- if data.missing | length <= data.present | length -%}
                {%- set _ = report.lines.append(
                  '  Fehlt auf: ' ~
                  (data.missing | join(', '))
                ) -%}
              {%- else -%}
                {%- set _ = report.lines.append(
                  '  Nur vorhanden auf: ' ~
                  (data.present | join(', '))
                ) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}

          {%- set _ = report.lines.append('') -%}
          {%- set _ = report.lines.append(
            'Betroffene VLANs: ' ~ (report.count | string)
          ) -%}

          {{ report.lines }}
      run_once: true
      no_log: true

    - name: VLAN-Abweichungen anzeigen
      ansible.builtin.debug:
        msg: "{{ vlan_missing_lines }}"
      run_once: true

    - name: VLAN-Namensabweichungen erstellen
      ansible.builtin.set_fact:
        vlan_name_lines: >-
          {%- set report = namespace(lines=[], count=0) -%}
          {%- set _ = report.lines.append(
            'UNTERSCHIEDLICHE VLAN-NAMEN'
          ) -%}
          {%- set _ = report.lines.append('') -%}

          {%- for vlan_number in all_vlan_ids -%}
            {%- set vlan_id = vlan_number | string -%}
            {%- set data = namespace(names=[], entries=[]) -%}

            {%- for switch in groups['dell_switches'] -%}
              {%- if vlan_id in hostvars[switch].switch_vlans -%}
                {%- set vlan_name =
                  hostvars[switch].switch_vlans[vlan_id]
                -%}

                {%- if vlan_name not in data.names -%}
                  {%- set _ = data.names.append(vlan_name) -%}
                {%- endif -%}

                {%- set entry = switch ~ ': ' ~ vlan_name -%}
                {%- set _ = data.entries.append(entry) -%}
              {%- endif -%}
            {%- endfor -%}

            {%- if data.names | length > 1 -%}
              {%- set report.count = report.count + 1 -%}

              {%- set _ = report.lines.append(
                'VLAN ' ~ ('%-4s' | format(vlan_id)) ~
                ' | ' ~ (data.names | join(' / '))
              ) -%}

              {%- for entry in data.entries -%}
                {%- set _ = report.lines.append(
                  '  ' ~ entry
                ) -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}

          {%- set _ = report.lines.append('') -%}
          {%- set _ = report.lines.append(
            'Namensabweichungen: ' ~ (report.count | string)
          ) -%}

          {{ report.lines }}
      run_once: true
      no_log: true

    - name: VLAN-Namensabweichungen anzeigen
      ansible.builtin.debug:
        msg: "{{ vlan_name_lines }}"
      run_once: true
