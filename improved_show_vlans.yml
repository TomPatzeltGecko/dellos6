---
- name: Dell VLAN-Gesamtuebersicht
  hosts: dell_switches
  gather_facts: false

  vars:
    ansible_become: true
    ansible_become_method: enable
    ansible_command_timeout: 120

  tasks:
    - name: VLAN-Informationen auslesen
      dellemc.os6.os6_command:
        commands:
          - show vlan
      register: vlan_result

    - name: VLAN-Datenstruktur initialisieren
      ansible.builtin.set_fact:
        switch_vlans: {}

    - name: VLAN-ID und VLAN-Name erfassen
      ansible.builtin.set_fact:
        switch_vlans: >-
          {{
            switch_vlans
            | combine({
                (item[0:5] | trim): (item[7:40] | trim)
              })
          }}
      loop: >-
        {{
          vlan_result.stdout_lines[0]
          | select('match', '^[0-9]')
          | list
        }}
      loop_control:
        label: "VLAN {{ item[0:5] | trim }}"

    - name: Alle VLAN-IDs zusammenfuehren
      ansible.builtin.set_fact:
        all_vlan_ids: >-
          {{
            groups['dell_switches']
            | map('extract', hostvars, 'switch_vlans')
            | map('list')
            | flatten
            | unique
            | map('int')
            | sort
            | list
          }}
      run_once: true

    - name: VLAN-Gesamtuebersicht anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          DELL VLAN-GESAMTUEBERSICHT
          ============================================================
          Anzahl Switches: {{ groups['dell_switches'] | length }}
          Anzahl VLANs:    {{ all_vlan_ids | length }}

          {% for vlan_number in all_vlan_ids %}
          {% set vlan_id = vlan_number | string %}
          {% set ns = namespace(switches=[], names=[]) %}
          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
          {% set _ = ns.switches.append(switch) %}
          {% set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {% if vlan_name not in ns.names %}
          {% set _ = ns.names.append(vlan_name) %}
          {% endif %}
          {% endif %}
          {% endfor %}
          VLAN {{ vlan_id }}
            Name:     {{ ns.names | join(' / ') }}
            Switches: {{ ns.switches | join(', ') }}
            Anzahl:   {{ ns.switches | length }} von {{ groups['dell_switches'] | length }}

          {% endfor %}
      run_once: true

    - name: Fehlende VLANs anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          VLAN-ABWEICHUNGEN
          ============================================================

          {% set report = namespace(count=0) %}
          {% for vlan_number in all_vlan_ids %}
          {% set vlan_id = vlan_number | string %}
          {% set ns = namespace(present=[], missing=[], names=[]) %}

          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
          {% set _ = ns.present.append(switch) %}
          {% set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {% if vlan_name not in ns.names %}
          {% set _ = ns.names.append(vlan_name) %}
          {% endif %}
          {% else %}
          {% set _ = ns.missing.append(switch) %}
          {% endif %}
          {% endfor %}

          {% if ns.missing | length > 0 %}
          {% set report.count = report.count + 1 %}
          VLAN {{ vlan_id }} | {{ ns.names | join(' / ') }}
            Vorhanden: {{ ns.present | join(', ') }}
            Fehlt auf: {{ ns.missing | join(', ') }}

          {% endif %}
          {% endfor %}

          {% if report.count == 0 %}
          Alle ermittelten VLANs sind auf allen Switches vorhanden.
          {% else %}
          Anzahl VLANs mit Abweichungen: {{ report.count }}
          {% endif %}
      run_once: true

    - name: Abweichende VLAN-Namen anzeigen
      ansible.builtin.debug:
        msg: |-
          ============================================================
          ABWEICHENDE VLAN-NAMEN
          ============================================================

          {% set report = namespace(count=0) %}
          {% for vlan_number in all_vlan_ids %}
          {% set vlan_id = vlan_number | string %}
          {% set ns = namespace(names=[]) %}

          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
          {% set vlan_name = hostvars[switch].switch_vlans[vlan_id] %}
          {% if vlan_name not in ns.names %}
          {% set _ = ns.names.append(vlan_name) %}
          {% endif %}
          {% endif %}
          {% endfor %}

          {% if ns.names | length > 1 %}
          {% set report.count = report.count + 1 %}
          VLAN {{ vlan_id }}
          {% for switch in groups['dell_switches'] %}
          {% if vlan_id in hostvars[switch].switch_vlans %}
            {{ switch }}: {{ hostvars[switch].switch_vlans[vlan_id] }}
          {% endif %}
          {% endfor %}

          {% endif %}
          {% endfor %}

          {% if report.count == 0 %}
          Die VLAN-Namen sind auf allen Switches einheitlich.
          {% else %}
          Anzahl VLANs mit unterschiedlichen Namen: {{ report.count }}
          {% endif %}
      run_once: true
